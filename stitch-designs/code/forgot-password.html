<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Forgot Password - Friendly Canvas</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@500&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-secondary-container": "#54647a",
                        "on-error-container": "#93000a",
                        "on-primary-fixed": "#00174b",
                        "inverse-on-surface": "#eff1f3",
                        "on-tertiary-fixed-variant": "#7d2d00",
                        "on-tertiary-container": "#ffede6",
                        "surface-dim": "#d8dadc",
                        "on-primary": "#ffffff",
                        "tertiary-fixed-dim": "#ffb596",
                        "surface-tint": "#0053db",
                        "surface-container-low": "#f2f4f6",
                        "tertiary-container": "#bc4800",
                        "on-secondary-fixed": "#0b1c30",
                        "outline-variant": "#c3c6d7",
                        "secondary-fixed-dim": "#b7c8e1",
                        "outline": "#737686",
                        "on-tertiary-fixed": "#360f00",
                        "surface-container-lowest": "#ffffff",
                        "tertiary": "#943700",
                        "on-error": "#ffffff",
                        "on-tertiary": "#ffffff",
                        "surface-bright": "#f7f9fb",
                        "on-surface": "#191c1e",
                        "primary-container": "#2563eb",
                        "inverse-primary": "#b4c5ff",
                        "background": "#f7f9fb",
                        "surface-container-high": "#e6e8ea",
                        "surface": "#f7f9fb",
                        "secondary-fixed": "#d3e4fe",
                        "on-background": "#191c1e",
                        "primary-fixed-dim": "#b4c5ff",
                        "on-surface-variant": "#434655",
                        "surface-container": "#eceef0",
                        "on-primary-fixed-variant": "#003ea8",
                        "inverse-surface": "#2d3133",
                        "primary": "#004ac6",
                        "error": "#ba1a1a",
                        "error-container": "#ffdad6",
                        "secondary": "#505f76",
                        "surface-variant": "#e0e3e5",
                        "tertiary-fixed": "#ffdbcd",
                        "on-secondary-fixed-variant": "#38485d",
                        "primary-fixed": "#dbe1ff",
                        "on-secondary": "#ffffff",
                        "surface-container-highest": "#e0e3e5",
                        "secondary-container": "#d0e1fb",
                        "on-primary-container": "#eeefff"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "spacing": {
                        "md": "16px",
                        "xl": "40px",
                        "base": "4px",
                        "sidebar_width": "280px",
                        "property_panel_width": "320px",
                        "sm": "8px",
                        "xs": "4px",
                        "lg": "24px"
                    },
                    "fontFamily": {
                        "body-md": ["Inter"],
                        "title-sm": ["Inter"],
                        "headline-md": ["Inter"],
                        "label-mono": ["JetBrains Mono"],
                        "body-sm": ["Inter"],
                        "label-caps": ["Inter"],
                        "display-lg": ["Inter"]
                    },
                    "fontSize": {
                        "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "title-sm": ["18px", { "lineHeight": "24px", "fontWeight": "600" }],
                        "headline-md": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "label-mono": ["12px", { "lineHeight": "16px", "letterSpacing": "0.02em", "fontWeight": "500" }],
                        "body-sm": ["13px", { "lineHeight": "18px", "fontWeight": "400" }],
                        "label-caps": ["11px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "700" }],
                        "display-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700" }]
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-surface text-on-surface font-body-md min-h-screen flex items-center justify-center p-md">
<!-- Suppressed navigation shell due to transactional page intent -->
<main class="w-full max-w-[440px]">
<!-- Brand Header -->
<div class="text-center mb-xl">
<h1 class="font-headline-md text-headline-md text-primary font-bold">Friendly Canvas</h1>
<p class="font-body-md text-body-md text-on-surface-variant mt-sm">Workspace Mode</p>
</div>
<!-- Auth Card Container -->
<div class="bg-surface-container-lowest rounded-xl border border-outline-variant p-xl shadow-sm">
<div class="mb-lg">
<h2 class="font-title-sm text-title-sm text-on-surface">Forgot Password</h2>
<p class="font-body-sm text-body-sm text-on-surface-variant mt-sm">
                    Enter your email address and we'll send you a link to reset your password.
                </p>
</div>
<form class="space-y-lg">
<div>
<label class="block font-label-caps text-label-caps text-on-surface-variant mb-xs" for="email">Email Address</label>
<input class="w-full px-sm py-2 border border-outline-variant rounded bg-surface-container-lowest text-on-surface font-body-md focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-colors duration-200" id="email" name="email" placeholder="name@company.com" required="" type="email"/>
</div>
<div class="pt-sm">
<button class="w-full bg-primary text-on-primary font-body-md py-2 px-md rounded hover:bg-primary-fixed-variant hover:text-on-primary-fixed-variant transition-colors duration-200 flex justify-center items-center gap-sm" type="submit">
<span>Send reset link</span>
<span class="material-symbols-outlined" style="font-size: 18px;">mail</span>
</button>
</div>
</form>
<div class="mt-lg pt-lg border-t border-outline-variant text-center">
<a class="inline-flex items-center gap-xs font-body-sm text-body-sm text-secondary hover:text-primary transition-colors duration-200" href="#">
<span class="material-symbols-outlined" style="font-size: 16px;">arrow_back</span>
<span>Back to login</span>
</a>
</div>
</div>
<!-- Footer / Support links -->
<div class="mt-xl text-center flex justify-center gap-lg font-body-sm text-body-sm text-on-surface-variant">
<a class="hover:text-primary transition-colors" href="#">Help</a>
<a class="hover:text-primary transition-colors" href="#">Privacy</a>
<a class="hover:text-primary transition-colors" href="#">Terms</a>
</div>
</main>
</body></html>
