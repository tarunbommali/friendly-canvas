<body class="h-full bg-background font-body-md text-on-background flex items-center justify-center p-md">
<!-- Suppressed navigation shell for a linear/transactional intent -->
<main class="w-full max-w-[440px] bg-surface-container-lowest border border-outline-variant rounded-lg p-xl shadow-[0_4px_12px_rgba(0,0,0,0.05)]">
<div class="mb-lg text-center">
<h1 class="font-display-lg text-display-lg text-on-surface mb-sm">Friendly Canvas</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Reset your password to regain access to your workspace.</p>
</div>
<form class="space-y-md">
<div>
<label class="block font-title-sm text-title-sm text-on-surface mb-xs" for="new-password">New Password</label>
<div class="relative">
<input class="w-full bg-surface border border-outline-variant rounded px-sm py-[10px] font-body-md text-body-md text-on-surface placeholder:text-outline focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors duration-150" id="new-password" name="new-password" placeholder="Enter your new password" type="password"/>
</div>
</div>
<div>
<label class="block font-title-sm text-title-sm text-on-surface mb-xs" for="confirm-password">Confirm New Password</label>
<div class="relative">
<input class="w-full bg-surface border border-outline-variant rounded px-sm py-[10px] font-body-md text-body-md text-on-surface placeholder:text-outline focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors duration-150" id="confirm-password" name="confirm-password" placeholder="Confirm your new password" type="password"/>
</div>
</div>
<div class="pt-sm">
<button class="w-full bg-primary text-on-primary rounded font-title-sm text-title-sm py-[10px] hover:bg-primary-fixed-variant transition-colors duration-150 shadow-[0_2px_4px_rgba(0,0,0,0.1)] flex justify-center items-center" type="submit">
                    Reset Password
                </button>
</div>
<div class="text-center pt-md">
<a class="font-body-sm text-body-sm text-secondary hover:text-primary transition-colors duration-150" href="#">Back to Login</a>
</div>
</form>
