<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Login - Friendly Canvas</title>
<!-- Google Fonts & Material Symbols -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@500&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Tailwind Theme Configuration -->
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-secondary-container": "#54647a",
                        "on-error-container": "#93000a",
                        "on-primary-fixed": "#00174b",
                        "inverse-on-surface": "#eff1f3",
                        "on-tertiary-fixed-variant": "#7d2d00",
                        "on-tertiary-container": "#ffede6",
                        "surface-dim": "#d8dadc",
                        "on-primary": "#ffffff",
                        "tertiary-fixed-dim": "#ffb596",
                        "surface-tint": "#0053db",
                        "surface-container-low": "#f2f4f6",
                        "tertiary-container": "#bc4800",
                        "on-secondary-fixed": "#0b1c30",
                        "outline-variant": "#c3c6d7",
                        "secondary-fixed-dim": "#b7c8e1",
                        "outline": "#737686",
                        "on-tertiary-fixed": "#360f00",
                        "surface-container-lowest": "#ffffff",
                        "tertiary": "#943700",
                        "on-error": "#ffffff",
                        "on-tertiary": "#ffffff",
                        "surface-bright": "#f7f9fb",
                        "on-surface": "#191c1e",
                        "primary-container": "#2563eb",
                        "inverse-primary": "#b4c5ff",
                        "background": "#f7f9fb",
                        "surface-container-high": "#e6e8ea",
                        "surface": "#f7f9fb",
                        "secondary-fixed": "#d3e4fe",
                        "on-background": "#191c1e",
                        "primary-fixed-dim": "#b4c5ff",
                        "on-surface-variant": "#434655",
                        "surface-container": "#eceef0",
                        "on-primary-fixed-variant": "#003ea8",
                        "inverse-surface": "#2d3133",
                        "primary": "#004ac6",
                        "error": "#ba1a1a",
                        "error-container": "#ffdad6",
                        "secondary": "#505f76",
                        "surface-variant": "#e0e3e5",
                        "tertiary-fixed": "#ffdbcd",
                        "on-secondary-fixed-variant": "#38485d",
                        "primary-fixed": "#dbe1ff",
                        "on-secondary": "#ffffff",
                        "surface-container-highest": "#e0e3e5",
                        "secondary-container": "#d0e1fb",
                        "on-primary-container": "#eeefff"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "spacing": {
                        "md": "16px",
                        "xl": "40px",
                        "base": "4px",
                        "sidebar_width": "280px",
                        "property_panel_width": "320px",
                        "sm": "8px",
                        "xs": "4px",
                        "lg": "24px"
                    },
                    "fontFamily": {
                        "body-md": ["Inter"],
                        "title-sm": ["Inter"],
                        "headline-md": ["Inter"],
                        "label-mono": ["JetBrains Mono"],
                        "body-sm": ["Inter"],
                        "label-caps": ["Inter"],
                        "display-lg": ["Inter"]
                    },
                    "fontSize": {
                        "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "title-sm": ["18px", { "lineHeight": "24px", "fontWeight": "600" }],
                        "headline-md": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "label-mono": ["12px", { "lineHeight": "16px", "letterSpacing": "0.02em", "fontWeight": "500" }],
                        "body-sm": ["13px", { "lineHeight": "18px", "fontWeight": "400" }],
                        "label-caps": ["11px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "700" }],
                        "display-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700" }]
                    }
                }
            }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        
        /* Custom input styling for the workspace aesthetic */
        .workspace-input {
            border: 1px solid #c3c6d7; /* outline-variant */
            background-color: #ffffff; /* surface-container-lowest */
        }
        .workspace-input:focus {
            border-color: #004ac6; /* primary */
            outline: none;
            box-shadow: 0 0 0 1px #004ac6;
        }
    </style>
</head>
<body class="bg-surface text-on-surface font-body-md min-h-screen flex items-center justify-center p-md">
<!-- Transactional intent: Suppressing SideNavBar and TopAppBar shells -->
<div class="w-full max-w-md bg-surface-container-lowest rounded-xl shadow-sm border border-outline-variant/30 p-xl flex flex-col gap-lg">
<!-- Header / Logo Area -->
<div class="flex flex-col items-center gap-sm mb-sm text-center">
<div class="w-12 h-12 bg-primary-container rounded-lg flex items-center justify-center mb-sm text-on-primary-container">
<span class="material-symbols-outlined" data-icon="brush" style="font-variation-settings: 'FILL' 1; font-size: 28px;">brush</span>
</div>
<h1 class="font-headline-md text-headline-md text-on-surface">Friendly Canvas</h1>
<p class="font-body-sm text-body-sm text-on-surface-variant">Sign in to your administrative workspace</p>
</div>
<!-- Login Form -->
<form class="flex flex-col gap-md" onsubmit="event.preventDefault();">
<!-- Email Input -->
<div class="flex flex-col gap-xs">
<label class="font-label-caps text-label-caps text-on-surface-variant uppercase tracking-wider" for="email">Email Address</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-on-surface-variant">
<span class="material-symbols-outlined text-[20px]" data-icon="mail">mail</span>
</div>
<input class="workspace-input w-full pl-10 pr-sm py-2 rounded font-body-md text-body-md text-on-surface transition-colors duration-200" id="email" name="email" placeholder="admin@friendlycanvas.com" required="" type="email"/>
</div>
</div>
<!-- Password Input -->
<div class="flex flex-col gap-xs">
<div class="flex justify-between items-center">
<label class="font-label-caps text-label-caps text-on-surface-variant uppercase tracking-wider" for="password">Password</label>
<a class="font-body-sm text-body-sm text-primary hover:text-primary-fixed-variant transition-colors duration-150" href="#">Forgot password?</a>
</div>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-on-surface-variant">
<span class="material-symbols-outlined text-[20px]" data-icon="lock">lock</span>
</div>
<input class="workspace-input w-full pl-10 pr-sm py-2 rounded font-body-md text-body-md text-on-surface transition-colors duration-200" id="password" name="password" placeholder="••••••••" required="" type="password"/>
</div>
</div>
<!-- Remember Me -->
<div class="flex items-center gap-sm mt-xs">
<input class="w-4 h-4 text-primary bg-surface-container-lowest border-outline-variant rounded focus:ring-primary focus:ring-2 cursor-pointer transition-colors duration-150" id="remember" name="remember" type="checkbox"/>
<label class="font-body-sm text-body-sm text-on-surface-variant cursor-pointer select-none" for="remember">Remember me for 30 days</label>
</div>
<!-- Submit Button -->
<button class="w-full bg-primary hover:bg-primary-fixed-variant text-on-primary font-title-sm text-title-sm py-2 px-md rounded transition-colors duration-200 mt-sm flex items-center justify-center gap-sm" type="submit">
                Sign in
                <span class="material-symbols-outlined text-[18px]" data-icon="arrow_forward">arrow_forward</span>
</button>
</form>
<!-- Footer Alternative Action -->
<div class="text-center mt-md pt-md border-t border-outline-variant/30">
<p class="font-body-sm text-body-sm text-on-surface-variant">
                Don't have an account? 
                <a class="text-primary hover:text-primary-fixed-variant font-medium transition-colors duration-150" href="#">Request access</a>
</p>
</div>
</div>
</body></html>
